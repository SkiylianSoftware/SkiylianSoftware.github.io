name: "Build and Deploy"

on:
  push:
    branches: [master]
  # Note: GitHub Actions free-tier schedules are approximate and may be delayed.
  # Live/offline on the home page is resolved client-side (Twitch embed
  # ONLINE/OFFLINE events), so the pipeline only refreshes analytics + stats.
  # Every 6 hours is plenty; pushes still redeploy instantly.
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Cache data files between runs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: _data/
          # Bump when a fetch script changes the shape of a _data file so the
          # restore never serves stale-shaped data (v2 -> v3: VODs gained a
          # "platform" field).
          key: site-data-v3

      - name: Cache locally-cached video thumbnails
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: assets/img/thumbs/
          # Bump when the thumbnail format/source changes.
          key: site-thumbs-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml Pillow python-dateutil

      - name: Fetch YouTube data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/fetch_youtube.py

      - name: Ensure local video thumbnails (cache-restore fallback)
        run: python scripts/fetch_thumbnails.py

      - name: Fetch YouTube Analytics (historical daily + per-video data)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/fetch_youtube_analytics.py

      - name: Verify video history was fetched
        run: |
          if [ ! -s _data/video_history.json ]; then
            echo "::warning::video_history.json missing - YouTube Analytics fetch failed (check YOUTUBE_REFRESH_TOKEN). Watch-time milestones will be unavailable."
          fi

      - name: Compute per-video momentum (hotness)
        run: python scripts/compute_video_momentum.py

      - name: Fetch Twitch data
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python scripts/fetch_twitch.py

      - name: Merge live status
        run: python scripts/merge_content.py

      - name: Fetch GitHub stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_github.py

      - name: Fetch PC parts list
        run: python scripts/fetch_parts.py

      - name: Track history (daily snapshot feeding the history rebuild)
        run: python scripts/track_history.py

      - name: Fetch Ko-fi data
        run: python scripts/fetch_kofi.py

      - name: Fetch Fourthwall data
        env:
          FW_USERNAME: ${{ secrets.FW_USERNAME }}
          FW_PASSWORD: ${{ secrets.FW_PASSWORD }}
        run: python scripts/fetch_fourthwall.py

      - name: Build clean history from analytics + video data
        env:
          DEBUG: "1"
        run: python scripts/build_history.py

      - name: Clear stale cached milestones.json
        run: rm -f _data/milestones.json && echo "Cleared cached milestones.json"

      - name: Detect milestones with debug
        env:
          DEBUG: "1"
        run: python scripts/detect_milestones.py

      - name: Track history (re-add today's snapshot after history rebuild)
        run: python scripts/track_history.py

      - name: Generate branded OG share cards
        run: python scripts/generate_og_cards.py

      - name: Generate RSS feed posts
        run: python scripts/generate_posts.py

      - name: Generate archive pages (series + game)
        run: python scripts/generate_archive.py

      - name: Compute future milestone ETAs
        run: python scripts/compute_future_milestones.py

      - name: Generate Year in Review pages
        run: python scripts/generate_year_review.py

      - name: Export public JSON API endpoints
        run: python scripts/export_api.py

      - name: Validate data schema versions
        run: python scripts/check_schema.py

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Upload debug data artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debug-data
          path: |
            _data/*.json
            _data/*.yml
            _data/*.yaml
          retention-days: 7

      - name: Validate posts and RSS feed
        run: |
          python3 << 'PYEOF'
          import glob, sys, yaml

          # 1. Every generated post must have parseable front matter with a title.
          problems = 0
          for p in glob.glob('_posts/*.md'):
              text = open(p, encoding='utf-8').read()
              if not text.startswith('---\n'):
                  print(f'? {p}: no front matter'); problems += 1; continue
              end = text.find('\n---\n', 4)
              if end == -1:
                  print(f'? {p}: unclosed front matter'); problems += 1; continue
              try:
                  fm = yaml.safe_load(text[4:end])
              except Exception as exc:
                  print(f'? {p}: YAML error: {exc}'); problems += 1; continue
              if not fm.get('title'):
                  print(f'? {p}: missing title'); problems += 1
              if not fm.get('image'):
                  print(f'? {p}: missing image'); problems += 1

          if problems:
              print(f'FAILED: {problems} post(s) with bad front matter')
              sys.exit(1)
          print(f'post front matter OK ({len(glob.glob("_posts/*.md"))} posts)')

          # 2. The built feed must be well-formed XML, newest-first, with titles.
          import xml.etree.ElementTree as ET
          ns = {'a': 'http://www.w3.org/2005/Atom'}
          root = ET.parse('_site/feed.xml').getroot()
          entries = root.findall('.//a:entry', ns)
          empty = [e.find('a:title', ns) for e in entries]
          empty = [t for t in empty if t is None or not (t.text or '').strip()]
          if empty:
              print(f'FAILED: {len(empty)} feed entry/ies with empty title')
              sys.exit(1)
          dates = [e.find('a:published', ns).text for e in entries]
          if dates != sorted(dates, reverse=True):
              print('FAILED: feed entries not sorted newest-first')
              sys.exit(1)
          print(f'feed.xml OK ({len(entries)} entries)')
          PYEOF

      - name: Validate HTML output
        run: |
          pip install -q html5validator
          html5validator --root _site --show-warnings false || echo "html5validator finished (errors above)"


      - name: Upload site artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Skip deploy if this commit is already live
        id: deployed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 << 'EOF'
          import json, os, urllib.request
          repo = "${{ github.repository }}"
          sha = "${{ github.sha }}"
          headers = {"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                     "Accept": "application/vnd.github+json"}
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/pages/deployments",
              headers=headers,
          )
          try:
              with urllib.request.urlopen(req) as r:
                  deps = json.load(r)
          except Exception as e:
              print(f"  deployment check failed: {e}")
              exit(0)
          for d in deps:
              if d.get("pages_build_version") == sha and d.get("is_latest"):
                  sreq = urllib.request.Request(
                      d["status_url"],
                      headers=headers,
                  )
                  try:
                      with urllib.request.urlopen(sreq) as sr:
                          st = json.load(sr)
                      if st.get("status") in ("deployed", "success"):
                          print("  commit already deployed; skipping deploy")
                          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                              f.write("skip=true\n")
                  except Exception as e:
                      print(f"  status check failed: {e}")
                  break
          EOF
      - name: Deploy to GitHub Pages
        if: steps.deployed.outputs.skip != 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          timeout: 1800000

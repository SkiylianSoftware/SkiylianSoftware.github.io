name: "Build and Deploy"

on:
  push:
    branches: [master]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache data files between runs
        uses: actions/cache@v4
        with:
          path: _data/
          key: site-data

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml Pillow

      - name: Fetch YouTube Analytics (historical daily data)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/fetch_youtube_analytics.py

      - name: Fetch YouTube data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/fetch_youtube.py

      - name: Fetch Twitch data
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python scripts/fetch_twitch.py

      - name: Merge live status
        run: python scripts/merge_content.py

      - name: Fetch GitHub stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_github.py

      - name: Fetch PC parts list
        run: python scripts/fetch_parts.py

      - name: Track history
        run: python scripts/track_history.py

      - name: Fetch Ko-fi data
        run: python scripts/fetch_kofi.py

      - name: Fetch Fourthwall data
        env:
          FW_USERNAME: ${{ secrets.FW_USERNAME }}
          FW_PASSWORD: ${{ secrets.FW_PASSWORD }}
        run: python scripts/fetch_fourthwall.py

      - name: Build clean history from analytics + video data
        env:
          DEBUG: "1"
        run: python scripts/build_history.py

      - name: Detect milestones with debug
        env:
          DEBUG: "1"
        run: python scripts/detect_milestones.py

      - name: Track history
        run: python scripts/track_history.py

      - name: Generate RSS feed posts
        run: python scripts/generate_posts.py

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

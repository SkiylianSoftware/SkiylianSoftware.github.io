name: Update site data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch YouTube data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/fetch_youtube.py

      - name: Fetch Twitch data
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python scripts/fetch_twitch.py

      - name: Merge live status
        run: python scripts/merge_content.py

      - name: Fetch GitHub stats
        run: python scripts/fetch_github.py

      - name: Fetch PC parts list
        env:
          PCPARTPICKER_LIST_ID: 4WRVw3
        run: python scripts/fetch_parts.py

      - name: Track history
        run: python scripts/track_history.py

      - name: Commit and push changes
        id: commit
        run: |
          git config --local user.name "SkiylianSoftware"
          git config --local user.email "skiyliansoftware@gmail.com"
          git add --force _data/
          git add _config.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto-update site data"
            git push
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger site deploy
        if: steps.commit.outputs.updated == 'true'
        run: |
          gh workflow run "Build and Deploy" --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
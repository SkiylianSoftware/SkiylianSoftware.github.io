<!-- Game / series art banner. Uses page.game_art (resolved on the archive page
     to the game's Steam header or a matching downloaded playlist cover),
     falling back to the channel banner when no art is available. -->
{% if page.game_art %}
<div class="game-hero" style="background-image: url('{{ page.game_art | relative_url }}'); background-size: cover; background-position: center;"></div>
<div class="game-hero-scrim"></div>
{% else %}
{% include banner.html %}
{% endif %}
